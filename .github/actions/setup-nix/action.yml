name: Set up Nix
description: Install Nix, restore the store cache, and realise the devshell.

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17
      with:
        # Keeping the derivations and outputs of the devshell is what makes the cache below
        # able to restore a usable shell rather than just its inputs.
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore the Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
      with:
        # Cargo.lock and the toolchain file are in the key because the store now holds the
        # compiled dependency tree, not just the toolchain and the dev tools. Those two are
        # exactly what crane's dependency derivation is built from, so a change to either
        # should land under a new key rather than restore artefacts nothing will hit.
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        # Up from 2G to cover the compiled dependency tree, which measures ~0.5G on top of
        # the toolchain and the dev tools. Not higher: the repository-wide cache limit is
        # 10G and amd64 and arm64 each keep their own, so headroom here is quota there.
        gc-max-store-size-linux: 4G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    - name: Realise the devshell
      shell: bash
      run: nix develop -c true
