# Tag-triggered release.
#
# Two properties the Go provider's release workflow did not have, both of which cost nothing:
#
#   1. Nothing reaches a registry before `checks` passes. There, the image build started
#      immediately, so a tag on a broken tree published a broken image.
#   2. `contents: write` lives in a different job from `packages: write` and `id-token: write`.
#      There, one job held all of them, so the job that could sign artefacts could also rewrite
#      the repository.
#
# The crates.io publish is last on purpose: it is the only irreversible step. A bad image can be
# retagged; a published version cannot be unpublished.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/checks

      - name: The tag names the version cargo would build
        if: startsWith(github.ref, 'refs/tags/')
        run: nix develop -c just check-version "${GITHUB_REF_NAME}"

  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # A native runner rather than pkgsCross: aws-lc-sys, which reqwest's rustls backend
            # pulls in, is a cmake and bindgen build, and each runner caches its own arch rather
            # than one holding both inside a 2G budget.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: ./.github/actions/setup-nix

      - name: Build and push by digest
        run: |
          set -euo pipefail
          nix build .#image --print-build-logs
          # streamLayeredImage writes a tarball to stdout rather than into the store, so this
          # never materialises a few hundred MB. skopeo comes from the devshell, so flake.lock
          # pins it instead of a marketplace action.
          ./result | nix develop -c skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --digestfile "digest-${{ matrix.arch }}" \
            docker-archive:/dev/stdin \
            "docker://${IMAGE}"
          echo "pushed $(cat "digest-${{ matrix.arch }}")"

      - name: Hand the digest to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, 2026-04-10
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          retention-days: 1

  publish:
    needs: image
    permissions:
      contents: read
      packages: write
      # Keyless signing and provenance, both via OIDC.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: ./.github/actions/setup-nix

      - name: Collect the per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 2026-03-11
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Assemble the manifest list
        id: manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@$(cat digest-amd64)" \
            "${IMAGE}@$(cat digest-arm64)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" \
            --format '{{ .Manifest.Digest }}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, 2026-05-07
        with:
          cosign-release: v3.0.6

      - name: Sign the manifest list
        # By digest, not by tag: a tag can be moved afterwards, a digest cannot.
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"

      - name: Attest an SBOM
        run: |
          set -euo pipefail
          nix develop -c syft "${IMAGE}@${{ steps.manifest.outputs.digest }}" \
            -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${IMAGE}@${{ steps.manifest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1, 2026-06-26
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2, 2026-07-13
        with:
          generate_release_notes: true
          body: |
            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Signed with cosign, keyless. Verify with:

            ```console
            cosign verify ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }} \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

  crates-io:
    # Last, because it is the only step that cannot be undone.
    needs: [publish, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: ./.github/actions/setup-nix

      - name: Publish
        run: nix develop -c cargo publish --locked -p external-dns-desec-webhook
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
